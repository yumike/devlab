User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Logs go to stderr (visible via `docker compose logs proxy`)
Syslog Off
LogLevel Info

# Pool sizing — generous for a single-developer sandbox
MaxClients 100
StartServers 5
MinSpareServers 5
MaxSpareServers 10
MaxRequestsPerChild 0

# Allowlist mode: every CONNECT/GET host must match an entry in /etc/tinyproxy/filter
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No

# Restrict CONNECT (HTTPS tunnel) to standard web ports — prevents using the proxy
# to tunnel arbitrary TCP (SSH, SMTP, etc.) to allowlisted hostnames.
ConnectPort 443
ConnectPort 80

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
